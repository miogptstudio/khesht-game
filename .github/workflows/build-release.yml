name: Build Khesht Release - Google Play

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release:
    name: Build Android AAB
    runs-on: ubuntu-24.04

    env:
      P4A_RELEASE_KEYSTORE: ${{ secrets.P4A_RELEASE_KEYSTORE }}
      P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.P4A_RELEASE_KEYSTORE_PASSWD }}
      P4A_RELEASE_KEYALIAS: ${{ secrets.P4A_RELEASE_KEYALIAS }}
      P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.P4A_RELEASE_KEYALIAS_PASSWD }}

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Python 3.11
      # ---------------------------------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"

      # ---------------------------------------------------------
      # 3. Java 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 4. Android SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------
      # 5. Install Android SDK components
      # ---------------------------------------------------------
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ---------------------------------------------------------
      # 6. Verify versions
      # ---------------------------------------------------------
      - name: Verify build environment
        run: |
          echo "===== Python ====="
          python --version

          echo "===== Java ====="
          java -version

          echo "===== Gradle ====="
          gradle --version || true

          echo "===== Android ====="
          adb version || true

          echo "===== Android SDK ====="
          echo "$ANDROID_HOME"

      # ---------------------------------------------------------
      # 7. Install build dependencies
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            liblzma-dev \
            zlib1g-dev

      # ---------------------------------------------------------
      # 8. Install Python build dependencies
      # ---------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "cython==0.29.34" \
            "buildozer==1.5.0"

      # ---------------------------------------------------------
      # 9. Check buildozer.spec
      # ---------------------------------------------------------
      - name: Check build configuration
        run: |
          test -f buildozer.spec

          echo "===== buildozer.spec ====="
          cat buildozer.spec

      # ---------------------------------------------------------
      # 10. Clean old Buildozer cache
      # ---------------------------------------------------------
      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      # ---------------------------------------------------------
      # 11. Build AAB
      # ---------------------------------------------------------
      - name: Build Release AAB
        run: |
          buildozer -v android release

      # ---------------------------------------------------------
      # 12. Show output
      # ---------------------------------------------------------
      - name: List build output
        if: always()
        run: |
          echo "===== bin ====="
          find bin -maxdepth 2 -type f -print 2>/dev/null || true

          echo "===== Buildozer output ====="
          find .buildozer -type f \
            \( -name "*.aab" -o -name "*.apk" \) \
            -print 2>/dev/null || true

      # ---------------------------------------------------------
      # 13. Upload AAB
      # ---------------------------------------------------------
      - name: Upload Google Play AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khesht-google-play-aab
          path: |
            bin/*.aab
            .buildozer/**/bin/*.aab
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # 14. Upload APK too, for testing
      # ---------------------------------------------------------
      - name: Upload testing APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khesht-testing-apk
          path: |
            bin/*.apk
            .buildozer/**/bin/*.apk
          if-no-files-found: ignore
          retention-days: 30