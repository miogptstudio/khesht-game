name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project
        run: |
          test -f main.py
          test -f buildozer.spec
          test -d .github/workflows
          python3 -m py_compile main.py config.py entities.py game_screen.py menu_screen.py splash_screen.py ui.py
          test -f assets/fonts/NotoSansArabic-Regular.ttf
          test -f assets/fonts/NotoSansArabic-Bold.ttf

      - name: Clean previous Android build state
        run: |
          buildozer android clean || true
          rm -rf .buildozer/android/platform/build-*

      - name: Verify pinned python-for-android source
        run: |
          grep -q '^p4a.branch = master$' buildozer.spec
          grep -q '^p4a.commit = 957a3e5$' buildozer.spec
          grep -q '^requirements = python3==3.11.5,hostpython3==3.11.5,kivy==2.3.0$' buildozer.spec
          grep -q '^android.archs = arm64-v8a,armeabi-v7a,x86,x86_64$' buildozer.spec
          echo "Using python-for-android commit 957a3e5 (v2024.01.21) from master"
          echo "Using Python 3.11.5 for target and host"
          echo "Building universal APK: arm64-v8a, armeabi-v7a, x86, x86_64"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Find APK
        run: |
          mkdir -p artifact
          find bin -type f -name "*.apk" -print -exec cp {} artifact/ \;
          test -n "$(find artifact -type f -name "*.apk" -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khesht-apk
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 30
