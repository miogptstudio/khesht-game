name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project
        run: |
          echo "======================================"
          echo " Project files"
          echo "======================================"
          ls -la

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

          echo "buildozer.spec found."

      - name: Build APK
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            --user root \
            -v "$PWD":/app \
            -w /app \
            kivy/buildozer:latest \
            -lc '
              set -e

              echo "======================================"
              echo " Build environment"
              echo "======================================"

              echo "System Python:"
              python3 --version

              echo "Buildozer:"
              buildozer --version

              echo "======================================"
              echo " Cleaning previous Android build"
              echo "======================================"

              rm -rf .buildozer
              rm -rf bin

              echo "======================================"
              echo " Creating temporary buildozer.spec"
              echo " with Python 3.12 explicitly pinned"
              echo "======================================"

              cp buildozer.spec buildozer.spec.original

              python3 - <<'"'"'PY'"'"'
              from pathlib import Path

              path = Path("buildozer.spec")
              text = path.read_text(encoding="utf-8")

              old = "requirements = python3,kivy==2.3.0"
              new = "requirements = python3==3.12.10,hostpython3==3.12.10,kivy==2.3.0"

              if old in text:
                  text = text.replace(old, new)
              elif "requirements =" in text:
                  import re
                  text = re.sub(
                      r"^requirements\s*=.*$",
                      new,
                      text,
                      flags=re.MULTILINE
                  )
              else:
                  raise SystemExit(
                      "ERROR: Could not find requirements in buildozer.spec"
                  )

              path.write_text(text, encoding="utf-8")

              print("Updated requirements:")
              for line in text.splitlines():
                  if line.strip().startswith("requirements"):
                      print(line)
              PY

              echo "======================================"
              echo " Verifying Python requirement"
              echo "======================================"

              grep -n "^requirements" buildozer.spec

              echo "======================================"
              echo " Starting Buildozer"
              echo "======================================"

              buildozer -v android debug

              echo "======================================"
              echo " Build completed"
              echo "======================================"

              echo "Generated files:"
              find . -type f \( -name "*.apk" -o -name "*.aab" \) -print
            '

      - name: Show generated files
        if: always()
        run: |
          echo "======================================"
          echo " APK / AAB files"
          echo "======================================"

          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khesht-android
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error