name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Khesht APK
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Check project
      # ---------------------------------------------------------
      - name: Check project files
        run: |
          echo "======================================"
          echo " Checking Project Files"
          echo "======================================"

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

          if [ ! -f main.py ]; then
            echo "ERROR: main.py not found!"
            exit 1
          fi

          echo "buildozer.spec exists."
          echo "main.py exists."

      # ---------------------------------------------------------
      # Build with Official Kivy Buildozer Docker Image
      # ---------------------------------------------------------
      - name: Build APK
        run: |
          docker run --rm \
            -v "$PWD":/home/user/hostpython \
            kivy/buildozer --warn_on_root=0 android debug

      # ---------------------------------------------------------
      # Show generated files
      # ---------------------------------------------------------
      - name: Show generated APK
        if: always()
        run: |
          echo "======================================"
          echo " Generated files"
          echo "======================================"

          find . -type f \( \
            -name "*.apk" \
            -o -name "*.aab" \
          \) -print

          echo
          echo "bin directory:"
          ls -lah bin || true

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khesht-android
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
