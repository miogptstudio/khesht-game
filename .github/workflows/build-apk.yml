name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Khesht APK
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Set up Python 3.11
      # ---------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------
      # 3. Set up JDK 17 (سازگار با Android Gradle جدید)
      # ---------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---------------------------------------------------------
      # 4. Install Dependencies & Updated Build Tools
      # ---------------------------------------------------------
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libtool \
            autoconf \
            automake \
            autotools-dev \
            libssl-dev \
            libffi-dev \
            python3-dev \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            zlib1g-dev \
            openssl \
            libgdbm-dev \
            libgdbm-compat-dev \
            liblzma-dev \
            libreadline-dev \
            libncursesw5-dev \
            libxml2-dev \
            libxmlsec1-dev \
            lzma-dev \
            zip \
            unzip \
            pkg-config \
            cmake

          python -m pip install --upgrade pip setuptools wheel
          # استفاده از آخرین نسخه‌های هماهنگ
          pip install --upgrade buildozer "cython>=0.29.33,<3.0" python-for-android

      # ---------------------------------------------------------
      # 5. Full Clean
      # ---------------------------------------------------------
      - name: Clean Previous Builds
        run: |
          rm -rf .buildozer
          buildozer clean || true

      # ---------------------------------------------------------
      # 6. Build APK & Capture Full Errors
      # ---------------------------------------------------------
      - name: Build APK with Buildozer
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK: ""
          ANDROID_NDK_LATEST_HOME: ""
        run: |
          buildozer -v android debug

      # ---------------------------------------------------------
      # 7. Upload Artifact
      # ---------------------------------------------------------
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khesht-android
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
