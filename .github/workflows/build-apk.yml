name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project
        run: |
          echo "=== Project files ==="
          ls -la

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

      - name: Build APK
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            --user root \
            -v "$PWD":/app \
            -w /app \
            kivy/buildozer:latest \
            -lc '
              set -e

              echo "======================================"
              echo " Installing Python 3.12"
              echo "======================================"

              apt-get update
              apt-get install -y \
                python3.12 \
                python3.12-dev \
                python3.12-venv

              echo "=== Python versions ==="
              python3.12 --version
              python3 --version

              echo "======================================"
              echo " Creating Python 3.12 environment"
              echo "======================================"

              python3.12 -m venv /opt/python312

              /opt/python312/bin/python -m pip install --upgrade pip setuptools wheel

              echo "======================================"
              echo " Installing Buildozer"
              echo "======================================"

              /opt/python312/bin/pip install \
                "buildozer>=1.5.0" \
                "Cython<3.0"

              echo "=== Buildozer version ==="
              /opt/python312/bin/buildozer --version

              echo "=== Cython version ==="
              /opt/python312/bin/cython --version

              echo "======================================"
              echo " Cleaning previous build"
              echo "======================================"

              rm -rf .buildozer
              rm -rf bin

              echo "======================================"
              echo " Starting Android build"
              echo "======================================"

              /opt/python312/bin/buildozer -v android debug

              echo "======================================"
              echo " Build completed"
              echo "======================================"

              find . -type f \( -name "*.apk" -o -name "*.aab" \) -print
            '

      - name: Show generated files
        if: always()
        run: |
          echo "=== Searching for APK/AAB ==="
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khesht-android
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error