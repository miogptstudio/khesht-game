name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "PWD=$PWD"
          ls -la
          test -f main.py
          test -f buildozer.spec
          test -d assets

      - name: Pull Buildozer image
        run: docker pull kivy/buildozer:latest

      - name: Build APK
        run: |
          docker run --rm \
            --user root \
            -v "$PWD":/app \
            -w /app \
            kivy/buildozer:latest \
            bash -lc "buildozer -v android debug"

      - name: List output
        if: always()
        run: |
          ls -la
          ls -la bin || true
          find . -name "*.apk" -ls || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khesht-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14