name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Khesht APK
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Verify files
      # ---------------------------------------------------------
      - name: Check required files
        run: |
          echo "======================================"
          echo " Checking Project Files"
          echo "======================================"

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

          if [ ! -f main.py ]; then
            echo "ERROR: main.py not found!"
            exit 1
          fi

          echo "buildozer.spec: OK"
          echo "main.py: OK"

      # ---------------------------------------------------------
      # Set up Python 3.11 (جلوگیری از ارور Python 3.14)
      # ---------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------
      # Install Dependencies & Buildozer
      # ---------------------------------------------------------
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libffi-dev libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev libxml2-dev libxmlsec1-dev libffi-dev liblzma-dev lzma-dev zip unzip
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33

      # ---------------------------------------------------------
      # Build APK using Buildozer
      # ---------------------------------------------------------
      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      # ---------------------------------------------------------
      # Show generated files
      # ---------------------------------------------------------
      - name: Show generated APK
        if: always()
        run: |
          echo "======================================"
          echo " Generated Files"
          echo "======================================"

          find . -type f \( \
            -name "*.apk" \
            -o -name "*.aab" \
          \) -print

          echo
          echo "bin directory content:"
          ls -lah bin || true

      # ---------------------------------------------------------
      # Upload APK Artifact
      # ---------------------------------------------------------
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khesht-android
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
