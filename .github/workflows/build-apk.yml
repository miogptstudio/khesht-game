name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project
        run: |
          echo "Python project files:"
          ls -la

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

      - name: Build APK
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            --user root \
            -v "$PWD":/app \
            -w /app \
            kivy/buildozer:latest \
            -lc '
              set -e

              echo "=== Python ==="
              python3 --version

              echo "=== Buildozer ==="
              buildozer --version

              echo "=== Cython ==="
              python3 -m pip uninstall -y Cython || true
              python3 -m pip install --no-cache-dir "Cython<3.0"

              echo "=== Cython version ==="
              cython --version

              echo "=== Cleaning old Android build ==="
              rm -rf .buildozer/android/platform/build-*

              echo "=== Starting Buildozer ==="
              buildozer -v android debug
            '

      - name: Show generated files
        if: always()
        run: |
          echo "=== APK/AAB files ==="
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khesht-android
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error