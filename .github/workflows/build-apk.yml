name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project
        run: |
          test -f main.py
          test -f buildozer.spec
          test -d .github/workflows
          python3 -m py_compile main.py config.py entities.py game_screen.py menu_screen.py splash_screen.py
          grep -q "python3==3.12.10" buildozer.spec

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Find APK
        run: |
          mkdir -p artifact
          find bin -type f -name "*.apk" -print -exec cp {} artifact/ \;
          test -n "$(find artifact -type f -name "*.apk" -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khesht-apk
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 30
