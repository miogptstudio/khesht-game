name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Khesht APK
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Verify files
      # ---------------------------------------------------------
      - name: Check required files
        run: |
          echo "======================================"
          echo " Checking Project Files"
          echo "======================================"

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

          if [ ! -f main.py ]; then
            echo "ERROR: main.py not found!"
            exit 1
          fi

          echo "buildozer.spec: OK"
          echo "main.py: OK"

      # ---------------------------------------------------------
      # Build APK using Kivy Buildozer Docker Container
      # ---------------------------------------------------------
      - name: Build APK with Buildozer
        run: |
          docker run --rm \
            -v "$PWD":/home/user/hostpython \
            --entrypoint /bin/bash \
            kivy/buildozer -c "yes | buildozer -v android debug"

      # ---------------------------------------------------------
      # Show generated files
      # ---------------------------------------------------------
      - name: Show generated APK
        if: always()
        run: |
          echo "======================================"
          echo " Generated Files"
          echo "======================================"

          find . -type f \( \
            -name "*.apk" \
            -o -name "*.aab" \
          \) -print

          echo
          echo "bin directory content:"
          ls -lah bin || true

      # ---------------------------------------------------------
      # Upload APK Artifact
      # ---------------------------------------------------------
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khesht-android
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
