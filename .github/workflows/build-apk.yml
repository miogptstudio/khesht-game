name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project
        run: |
          test -f main.py
          test -f buildozer.spec
          test -d .github/workflows
          python3 -m py_compile main.py config.py entities.py game_screen.py menu_screen.py splash_screen.py

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            .buildozer_global
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK with official Buildozer image
        run: |
          docker pull ghcr.io/kivy/buildozer:latest
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/user/hostcwd" \
            ghcr.io/kivy/buildozer:latest android debug

      - name: Show APK output
        run: |
          ls -lah bin/
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khesht-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
