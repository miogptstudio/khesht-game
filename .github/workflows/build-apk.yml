name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          ls -la
          test -f main.py
          test -f buildozer.spec
          test -f assets/icon.png

      - name: Build APK with official Kivy Docker image
        run: |
          mkdir -p "$HOME/.buildozer"
          docker run --rm \
            --volume "$HOME/.buildozer":/home/user/.buildozer \
            --volume "$PWD":/home/user/hostcwd \
            --workdir /home/user/hostcwd \
            kivy/buildozer:latest \
            buildozer -v android debug

      - name: List APK
        if: always()
        run: |
          ls -la bin || true
          find . -name "*.apk" -ls || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khesht-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14