name: Build Khesht APK (Testing)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify project
        run: |
          test -f main.py
          test -f buildozer.spec
          python3 -m py_compile main.py config.py entities.py game_screen.py menu_screen.py splash_screen.py ui.py
          test -f assets/fonts/NotoSansArabic-Regular.ttf
          test -f assets/fonts/NotoSansArabic-Bold.ttf
          test -f assets/fonts/Suls.ttf
      - name: Clean previous Android build state
        run: |
          buildozer android clean || true
          rm -rf .buildozer/android/platform/build-*
      - name: Build APK
        run: buildozer -v android debug
      - name: Find APK
        run: |
          mkdir -p artifact
          find bin -type f -name '*.apk' -print -exec cp {} artifact/ \;
          test -n "$(find artifact -type f -name '*.apk' -print -quit)"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khesht-apk
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 30
