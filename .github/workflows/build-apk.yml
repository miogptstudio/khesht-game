name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project
        run: |
          echo "======================================"
          echo " Checking project"
          echo "======================================"

          pwd
          ls -la

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

          echo "buildozer.spec found."

      - name: Build APK
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            --user root \
            -v "$PWD":/app \
            -w /app \
            kivy/buildozer:latest \
            -c '
              set -e

              echo "======================================"
              echo " Build environment"
              echo "======================================"

              echo "System Python:"
              python3 --version

              echo "Buildozer:"
              buildozer --version

              echo "======================================"
              echo " Installing compatible Cython"
              echo "======================================"

              python3 -m pip install --no-cache-dir --force-reinstall "Cython<3"

              echo "Cython:"
              cython --version

              echo "======================================"
              echo " Cleaning previous build"
              echo "======================================"

              rm -rf .buildozer
              rm -rf bin

              echo "======================================"
              echo " Checking buildozer.spec"
              echo "======================================"

              grep -n "^requirements" buildozer.spec || true
              grep -n "^android." buildozer.spec || true

              echo "======================================"
              echo " Starting Buildozer"
              echo "======================================"

              buildozer -v android debug

              echo "======================================"
              echo " BUILD SUCCESSFUL"
              echo "======================================"

              echo "Generated APK/AAB files:"
              find . -type f \( -name "*.apk" -o -name "*.aab" \) -print
            '

      - name: Find APK
        if: always()
        run: |
          echo "======================================"
          echo " Searching for APK/AAB"
          echo "======================================"

          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khesht-android
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error