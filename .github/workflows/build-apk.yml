name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "Checking buildozer.spec..."
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

      - name: Build APK
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            --user root \
            -v "$PWD":/app \
            -w /app \
            kivy/buildozer:latest \
            -lc "buildozer -v android debug"

      - name: Find generated APK
        if: success()
        run: |
          echo "Searching for APK files..."
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error